<svg xmlns="http://www.w3.org/2000/svg" width="760" height="92" viewBox="0 0 760 92" role="img" aria-labelledby="title desc">
  <title id="title">AI runtime system online</title>
  <desc id="desc">A terminal panel showing the AI runtime services online</desc>
  <defs>
    <linearGradient id="border" x1="0" x2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="758" height="90" rx="12" fill="#0d1117" stroke="url(#border)" stroke-width="2"/>
  <path d="M1 27h758" stroke="#30363d"/>
  <circle cx="17" cy="14" r="4" fill="#ff5f57"/>
  <circle cx="31" cy="14" r="4" fill="#febc2e"/>
  <circle cx="45" cy="14" r="4" fill="#28c840"/>
  <text x="380" y="18" text-anchor="middle" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10">gines@agent-runtime: ~</text>
  <text x="20" y="51" fill="#22d3ee" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">$ boot --profile enterprise-ai</text>
  <text x="20" y="75" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">context</text>
  <text x="92" y="75" fill="#a78bfa" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">LOADED</text>
  <text x="175" y="75" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">tools</text>
  <text x="223" y="75" fill="#a78bfa" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">ARMED</text>
  <text x="292" y="75" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">models</text>
  <text x="348" y="75" fill="#a78bfa" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">LOCAL</text>
  <circle cx="526" cy="71" r="4" fill="#22c55e" filter="url(#glow)">
    <animate attributeName="opacity" values="1;.35;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="539" y="75" fill="#22c55e" filter="url(#glow)" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" font-weight="700">SYSTEM ONLINE</text>
</svg>
